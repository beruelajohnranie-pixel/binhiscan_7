<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BinhiScan</title>
<meta name="theme-color" content="#1b3a29"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css"></head><body><div id="land"></div>
<svg style="display:none"><symbol id="i-seed" viewBox="0 0 24 24"><path d="M12 2.5c4.6 2.6 7 6.6 7 10.5a7 7 0 01-14 0c0-3.900 2.400-7.900 7-10.500zM12 8v12M12 12.500c-2-.6-3.200-1.800-3.800-3.500M12 15.500c2-.6 3.200-1.800 3.800-3.500"/></symbol><symbol id="i-set" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 4v6M9 14v6"/></symbol><symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></symbol><symbol id="i-guide" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4zM9 8h6M9 12h6"/></symbol><symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 100-8 4 4 0 000 8z"/></symbol><symbol id="i-soil" viewBox="0 0 24 24"><path d="M12 20v-8M12 12c0-4-3-6-7-6 0 4 3 6 7 6zM12 14c0-3 2-5 6-5 0 3-2 5-6 5zM6 21h12"/></symbol><symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol><symbol id="i-img" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M9 9.5h.01"/></symbol><symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.900V16h7v-2.100A6 6 0 0012 3z"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol></svg>
<div class="bg"><i></i><i></i></div><div class="ffs" id="ffs"></div>
<div class="app">
<div class="hdw"><header class="hd"><div class="lg" id="hlogo"></div><div><b>BinhiScan</b><small data-i="hdsub"></small></div><button class="ib" id="hb" data-label="settings"><svg class="ic"><use href="#i-set"/></svg></button></header></div>

<section class="pg on" id="p-home">
<div class="greet" id="greet"></div>
<div class="card hero2"><div class="hx"><h2 data-i="welcome"></h2><p data-i="welcomeP"></p>
<button class="btn pulse" data-go="scan"><svg class="ic"><use href="#i-cam"/></svg><span data-i="scanSeed"></span></button><button class="btn g" data-go="guide" style="margin:0" data-i="viewGuides"></button></div><div class="vf2"><i></i><i></i><i></i><i></i><s></s><u></u></div></div>
<div class="stats"><div class="card"><b id="ns">0</b><span data-i="savedScans"></span></div><div class="card"><b id="nc">0</b><span data-i="seedsCat"></span></div></div>
<div class="card" id="nowc"></div><div class="card" id="sod"></div>
<div class="card"><h2 data-i="commonH"></h2><p data-i="commonP"></p><div class="chips" id="cats" style="margin-bottom:12px"></div><input id="sq" class="srch"><div class="chips" id="seeds"></div></div>
</section>

<section class="pg" id="p-scan">
<div class="card"><h2 data-i="scanH"></h2><p data-i="scanP"></p>

<div class="two"><button class="btn" id="bcam"><svg class="ic"><use href="#i-cam"/></svg><span data-i="scanCam"></span></button><label class="btn g" style="margin:0"><span data-i="uploadPhoto"></span><input type="file" id="up" accept="image/*" hidden></label></div>
<p class="note" style="margin:14px 0 0" data-i="camNote"></p></div>
</section>

<section class="pg" id="p-guide"><div class="card"><h2 data-i="guideH"></h2><p data-i="guideP"></p><label class="l" data-i="selectSeed"></label><select id="gs"></select></div><div class="card" id="gout"></div></section>

<section class="pg" id="p-soil">
<div class="card"><h2 data-i="soilH"></h2><p data-i="soilP"></p>
<div class="two"><label class="btn g" style="margin:0"><span data-i="upload"></span><input type="file" id="sp1" accept="image/*" hidden></label><label class="btn g" style="margin:0"><span data-i="takePhoto"></span><input type="file" id="sp2" accept="image/*" capture="environment" hidden></label></div><div id="sthumb"></div></div>
<div class="card"><div class="scene" id="scene"></div><label class="l" style="margin-top:0" data-i="q1"></label><select id="cs"></select>
<label class="l" data-i="q2"></label><select id="so"><option value="Clay" data-i="clay"></option><option value="Loam" data-i="loam" selected></option><option value="Sandy" data-i="sandy"></option></select>
<label class="l" data-i="q3"></label><select id="mo"><option value="Dry" data-i="dry"></option><option value="Moist" data-i="moist" selected></option><option value="Waterlogged" data-i="wet"></option></select>
<label class="l" data-i="q4"></label><select id="sn"><option value="3" data-i="sun3"></option><option value="5" data-i="sun5"></option><option value="7" data-i="sun7" selected></option></select>
<label class="l" data-i="q5"></label><select id="wx"><option value="Sunny" data-i="wSunny"></option><option value="Cloudy" data-i="wCloudy"></option><option value="Rainy" data-i="wRainy"></option><option value="Cool" data-i="wCool"></option></select>
<button class="btn" id="chk" style="margin-top:20px" data-i="checkSuit"></button></div>
<div class="card" id="sout" hidden></div>
</section>

<section class="pg" id="p-season"><div class="card"><h2 data-i="seasonH"></h2><p data-i="seasonP"></p>
<div class="ready"><small style="display:block;opacity:.8" data-i="today"></small><b style="font:700 22px var(--serif)" id="dt"></b></div>
<label class="l" data-i="chooseSeed"></label><select id="ses"></select><button class="btn" id="sbt" style="margin-top:14px" data-i="checkSeason"></button>
<div id="sout2"></div><p class="note" style="margin:6px 0 0" data-i="seasonNote"></p></div></section>

<section class="pg" id="p-settings">
<div class="card"><h2 data-i="setH"></h2>
<label class="l" style="margin-top:14px" data-i="langL"></label>
<div class="seg" id="lang"><button data-l="en">English</button><button data-l="tl">Tagalog</button></div></div>
<div class="card"><h2 data-i="histH"></h2><p data-i="histP"></p>
<button class="btn g" id="exp" data-i="exportH"></button><button class="btn r" id="clr" data-i="clearH"></button><div id="hl"></div></div>
</section>
</div>

<nav class="tab"><button data-go="home"><svg class="ic"><use href="#i-home"/></svg><span data-i="tHome"></span></button><button data-go="guide"><svg class="ic"><use href="#i-guide"/></svg><span data-i="tGuide"></span></button>
<div class="mid"><button class="sc" data-go="scan" aria-label="Scan Seed"><svg class="ic"><use href="#i-cam"/></svg></button><small data-i="tScan"></small></div>
<button data-go="soil"><svg class="ic"><use href="#i-soil"/></svg><span data-i="tSoil"></span></button><button data-go="season"><svg class="ic"><use href="#i-sun"/></svg><span data-i="tSeason"></span></button></nav>

<div id="cam" class="ov"><video id="vid" autoplay playsinline muted></video><div class="ctop"><button class="rb" id="cb">‹</button></div><div class="frame"><b></b><b></b><b></b><b></b></div><div id="hint"></div>
<div id="tipbox" hidden data-i="tips"></div>
<div class="cbar"><label class="rb" aria-label="Gallery">🖼<input type="file" id="up2" accept="image/*" hidden></label><button id="shut" aria-label="Capture"></button><button class="rb" id="tips">?</button></div><input type="file" id="camin" accept="image/*" capture="environment" hidden></div>
<div id="ana" class="ov"><button class="rb" id="ab">‹</button><div class="circ"><img id="aimg" alt=""><div class="sweep" id="sw"></div></div><p id="atx"></p><button class="btn" id="retry" hidden data-i="tryAgain"></button></div>
<div id="res" class="ov"></div><div id="sheet" class="sheet" hidden><div class="sbd" data-close></div><div class="sp" role="dialog" aria-modal="true"><div class="sgrab"></div><div class="shd"><h2 id="sttl"></h2><button class="sx" data-close aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div><div class="sbody" id="sbody"></div></div></div><div id="toast"></div>

<script src="lib/tf.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js';document.head.appendChild(s)"></script>
<script src="seeds.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script></body></html>
